<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Faye ♡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: #070b18;
      color: white;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(40, 90, 255, 0.18);
      filter: blur(80px);
      top: 10%;
      left: 10%;
    }
    .glow2 {
      position: fixed;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: rgba(255, 40, 80, 0.12);
      filter: blur(80px);
      bottom: 10%;
      right: 10%;
    }
    .container {
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 30px;
    }
    .small {
      font-family: Arial, sans-serif;
      letter-spacing: 5px;
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 25px;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(50px, 12vw, 100px);
      letter-spacing: 8px;
      margin-bottom: 20px;
    }
    .line {
      width: 80px;
      height: 1px;
      background: white;
      opacity: 0.5;
      margin: 25px auto;
    }
    .message {
      font-size: 18px;
      font-style: italic;
      opacity: 0.75;
      max-width: 500px;
      line-height: 1.8;
      margin: auto;
    }
    .enter {
      display: inline-block;
      margin-top: 40px;
      padding: 14px 32px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 30px;
      color: white;
      text-decoration: none;
      font-family: Arial, sans-serif;
      letter-spacing: 2px;
      transition: 0.3s;
    }
    .enter:hover {
      background: white;
      color: #070b18;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="container">
    <div class="small">
      A little something
    </div>
    <h1>
      FAYE ♡
    </h1>
    <div class="line"></div>
    <p class="message">
      Made with a little too much nostalgia.
    </p>
    <a href="#" class="enter">
      ENTER
    </a>
  </div>
</body>
</html>
