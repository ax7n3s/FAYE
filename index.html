<script>
/* =========================================
   FAYE ♡ — DREAMY AESTHETIC LOVE STORY JS
========================================= */


/* ==============================
   FLOATING HEARTS + SPARKLES
============================== */

const aestheticItems = ["♡", "♥", "✦", "⋆", "💗", "✨", "🦋"];

function createFloatingItem() {
  const item = document.createElement("span");

  item.innerHTML =
    aestheticItems[Math.floor(Math.random() * aestheticItems.length)];

  item.style.position = "fixed";
  item.style.left = Math.random() * 100 + "vw";
  item.style.bottom = "-50px";
  item.style.fontSize = 12 + Math.random() * 20 + "px";
  item.style.zIndex = "1";
  item.style.pointerEvents = "none";
  item.style.opacity = 0.25 + Math.random() * 0.5;

  const duration = 7 + Math.random() * 7;

  item.animate(
    [
      {
        transform: "translateY(0) translateX(0) rotate(0deg)",
        opacity: 0
      },
      {
        opacity: 0.65
      },
      {
        transform:
          `translateY(-115vh) translateX(${Math.random() * 140 - 70}px) rotate(360deg)`,
        opacity: 0
      }
    ],
    {
      duration: duration * 1000,
      easing: "linear"
    }
  );

  document.body.appendChild(item);

  setTimeout(() => item.remove(), duration * 1000);
}

setInterval(createFloatingItem, 1100);



/* ==============================
   RANDOM TWINKLING STARS
============================== */

function createStar() {

  const star = document.createElement("span");

  star.className = "random-star";
  star.innerHTML = "✦";

  star.style.position = "fixed";
  star.style.left = Math.random() * 100 + "vw";
  star.style.top = Math.random() * 100 + "vh";

  star.style.fontSize = 7 + Math.random() * 15 + "px";

  star.style.color = "white";
  star.style.opacity = "0";

  star.style.pointerEvents = "none";
  star.style.zIndex = "0";

  const duration = 1800 + Math.random() * 2500;

  star.animate(
    [
      {
        opacity: 0,
        transform: "scale(.3) rotate(0deg)"
      },
      {
        opacity: 0.8,
        transform: "scale(1.4) rotate(100deg)"
      },
      {
        opacity: 0,
        transform: "scale(.3) rotate(180deg)"
      }
    ],
    {
      duration: duration,
      iterations: 2,
      easing: "ease-in-out"
    }
  );

  document.body.appendChild(star);

  setTimeout(() => star.remove(), duration * 2);
}

setInterval(() => {

  if (document.querySelectorAll(".random-star").length < 14) {
    createStar();
  }

}, 700);



/* ==============================
   CINEMATIC SECTION REVEAL
============================== */

const sections = document.querySelectorAll("section");

sections.forEach(section => {

  section.style.opacity = "0";
  section.style.transform = "translateY(35px)";
  section.style.transition =
    "opacity 1s ease, transform 1s ease";

});


const sectionObserver = new IntersectionObserver(
  entries => {

    entries.forEach(entry => {

      if (entry.isIntersecting) {

        entry.target.style.opacity = "1";
        entry.target.style.transform = "translateY(0)";

      }

    });

  },
  {
    threshold: 0.12
  }
);

sections.forEach(section => {
  sectionObserver.observe(section);
});


/* Opening section immediately visible */

if (sections[0]) {
  sections[0].style.opacity = "1";
  sections[0].style.transform = "translateY(0)";
}



/* ==============================
   PARALLAX STICKERS
============================== */

document.addEventListener("scroll", () => {

  const scrollY = window.scrollY;

  document.querySelectorAll(".sticker").forEach((sticker, index) => {

    const movement =
      Math.sin(scrollY * 0.008 + index) * 8;

    sticker.style.translate =
      `0 ${movement}px`;

  });

});



/* ==============================
   BUTTON SPARKLE BURST
============================== */

function createButtonSparkles(x, y) {

  for (let i = 0; i < 14; i++) {

    const sparkle = document.createElement("span");

    sparkle.innerHTML =
      Math.random() > 0.5 ? "✨" : "♡";

    sparkle.style.position = "fixed";

    sparkle.style.left = x + "px";
    sparkle.style.top = y + "px";

    sparkle.style.fontSize =
      11 + Math.random() * 15 + "px";

    sparkle.style.pointerEvents = "none";

    sparkle.style.zIndex = "999";

    const moveX =
      Math.random() * 180 - 90;

    const moveY =
      Math.random() * 180 - 90;

    sparkle.animate(
      [
        {
          transform: "translate(0,0) scale(1)",
          opacity: 1
        },
        {
          transform:
            `translate(${moveX}px,${moveY}px) scale(.2)`,
          opacity: 0
        }
      ],
      {
        duration: 850,
        easing: "ease-out"
      }
    );

    document.body.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 900);
  }
}


document.addEventListener("click", function(e) {

  if (
    e.target.tagName === "BUTTON" ||
    e.target.classList.contains("start")
  ) {

    createButtonSparkles(
      e.clientX,
      e.clientY
    );

  }

});



/* ==============================
   SOFT CURSOR / TOUCH GLOW
============================== */

const glow = document.createElement("div");

glow.style.position = "fixed";
glow.style.width = "280px";
glow.style.height = "280px";

glow.style.borderRadius = "50%";

glow.style.background =
  "radial-gradient(circle, rgba(255,70,130,.10), transparent 70%)";

glow.style.pointerEvents = "none";

glow.style.transform =
  "translate(-50%, -50%)";

glow.style.zIndex = "0";

glow.style.left = "50%";
glow.style.top = "50%";

glow.style.transition =
  "left .2s ease, top .2s ease";

document.body.appendChild(glow);


document.addEventListener("mousemove", e => {

  glow.style.left = e.clientX + "px";
  glow.style.top = e.clientY + "px";

});


document.addEventListener("touchmove", e => {

  if (e.touches[0]) {

    glow.style.left =
      e.touches[0].clientX + "px";

    glow.style.top =
      e.touches[0].clientY + "px";

  }

}, { passive: true });



/* ==============================
   TITLE DREAMY GLOW
============================== */

document.querySelectorAll("h1, h2").forEach(title => {

  title.animate(
    [
      {
        textShadow:
          "0 0 15px rgba(255,30,100,.3)"
      },
      {
        textShadow:
          "0 0 35px rgba(255,30,100,.7), 0 0 60px rgba(80,130,255,.35)"
      }
    ],
    {
      duration: 2800,
      direction: "alternate",
      iterations: Infinity,
      easing: "ease-in-out"
    }
  );

});



/* =========================================
   QUESTION
========================================= */

const yesBtn =
  document.getElementById("yesBtn");

const noBtn =
  document.getElementById("noBtn");

const answer =
  document.getElementById("answerMessage");

const after =
  document.getElementById("afterAnswer");

let noClicks = 0;


noBtn.addEventListener("click", function() {

  noClicks++;

  if (noClicks === 1) {

    answer.innerHTML =
      "Think again 🥺💗";

    after.style.display = "block";

  }

  else if (noClicks === 2) {

    answer.innerHTML =
      "I don't believe you 😭🥺";

    after.style.display = "block";

  }

  else if (noClicks === 3) {

    answer.innerHTML =
      "Come onnn Faye 🥺❤️";

    after.style.display = "block";

  }

  else {

    answer.innerHTML =
      "The YES button is literally waiting for you 😭❤️";

    after.style.display = "block";

  }

});


yesBtn.addEventListener(
  "click",
  openFireworks
);


document
  .getElementById("yesAgain")
  .addEventListener(
    "click",
    openFireworks
  );



function openFireworks() {

  const question =
    document.getElementById("question");

  const fire =
    document.getElementById("fireworkSlide");


  question.style.display = "none";

  fire.style.display = "flex";

  fire.style.opacity = "1";
  fire.style.transform = "translateY(0)";


  setTimeout(() => {

    fire.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 100);


  startFireworks();

}



/* =========================================
   FIREWORKS
========================================= */

let fireworksStarted = false;


function startFireworks() {

  if (fireworksStarted) return;

  fireworksStarted = true;


  const canvas =
    document.getElementById("fireworks");

  const ctx =
    canvas.getContext("2d");


  let W, H;

  let rockets = [];

  let particles = [];


  function resize() {

    const ratio =
      window.devicePixelRatio || 1;

    W = window.innerWidth;

    H = window.innerHeight;


    canvas.width =
      W * ratio;

    canvas.height =
      H * ratio;


    canvas.style.width =
      W + "px";

    canvas.style.height =
      H + "px";


    ctx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );

  }


  resize();

  window.addEventListener(
    "resize",
    resize
  );


  const colors = [

    "#ff174f",
    "#397cff",
    "#ffffff",
    "#ff4f9a",
    "#6da0ff",
    "#ffd4e5"

  ];



  function launch() {

    rockets.push({

      x:
        Math.random() * W,

      y:
        H + 30,

      targetY:
        H * (
          .1 +
          Math.random() * .45
        ),

      speed:
        7 +
        Math.random() * 6,

      color:
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ]

    });

  }



  function explode(
    x,
    y,
    color
  ) {

    for (
      let i = 0;
      i < 130;
      i++
    ) {

      const angle =
        Math.random() *
        Math.PI * 2;

      const speed =
        Math.random() * 7 + 1;


      particles.push({

        x,
        y,

        vx:
          Math.cos(angle) *
          speed,

        vy:
          Math.sin(angle) *
          speed,

        alpha: 1,

        size:
          Math.random() *
          2.5 + 1,

        color

      });

    }

  }



  function animate() {

    ctx.fillStyle =
      "rgba(3,4,11,.18)";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );


    rockets.forEach(
      (r, i) => {

        r.y -= r.speed;


        ctx.beginPath();

        ctx.moveTo(
          r.x,
          r.y + 28
        );

        ctx.lineTo(
          r.x,
          r.y
        );


        ctx.strokeStyle =
          r.color;

        ctx.lineWidth = 2;

        ctx.shadowBlur = 18;

        ctx.shadowColor =
          r.color;

        ctx.stroke();


        if (
          r.y <= r.targetY
        ) {

          explode(
            r.x,
            r.y,
            r.color
          );

          rockets.splice(
            i,
            1
          );

        }

      }
    );


    particles.forEach(
      (p, i) => {

        p.x += p.vx;

        p.y += p.vy;


        p.vx *= .985;

        p.vy *= .985;

        p.vy += .04;


        p.alpha -= .009;


        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          p.color;

        ctx.globalAlpha =
          Math.max(
            p.alpha,
            0
          );


        ctx.shadowBlur = 15;

        ctx.shadowColor =
          p.color;

        ctx.fill();

        ctx.globalAlpha = 1;


        if (
          p.alpha <= 0
        ) {

          particles.splice(
            i,
            1
          );

        }

      }
    );


    requestAnimationFrame(
      animate
    );

  }


  for (
    let i = 0;
    i < 18;
    i++
  ) {

    setTimeout(
      launch,
      i * 220
    );

  }


  setInterval(() => {

    launch();

    if (
      Math.random() > .5
    ) {

      launch();

    }

  }, 650);


  animate();

}



/* =========================================
   CONTINUE → LETTER
========================================= */

document
  .getElementById(
    "continueBtn"
  )
  .addEventListener(
    "click",
    function() {

      const fire =
        document.getElementById(
          "fireworkSlide"
        );


      const letter =
        document.getElementById(
          "letterSlide"
        );


      fire.style.display =
        "none";


      letter.style.display =
        "flex";


      letter.style.opacity =
        "1";


      letter.style.transform =
        "translateY(0)";


      setTimeout(() => {

        letter.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 100);

    }
  );



/* =========================================
   FINAL — FLOWERS + SPARKLES
========================================= */

document
  .getElementById(
    "finalBtn"
  )
  .addEventListener(
    "click",
    function() {

      const letter =
        document.getElementById(
          "letterSlide"
        );


      const final =
        document.getElementById(
          "finalSlide"
        );


      letter.style.display =
        "none";


      final.style.display =
        "flex";


      final.style.opacity =
        "1";


      final.style.transform =
        "translateY(0)";


      setTimeout(() => {

        final.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 100);



      /* Falling flowers */

      for (
        let i = 0;
        i < 90;
        i++
      ) {

        const petal =
          document.createElement(
            "div"
          );


        petal.className =
          "petal";


        const decorations = [
          "🌸",
          "🌹",
          "💗",
          "✦",
          "🦋"
        ];


        petal.textContent =
          decorations[
            Math.floor(
              Math.random() *
              decorations.length
            )
          ];


        petal.style.left =
          Math.random() *
          100 + "%";


        petal.style.fontSize =
          (
            15 +
            Math.random() * 25
          ) + "px";


        petal.style.animationDuration =
          (
            5 +
            Math.random() * 7
          ) + "s";


        petal.style.animationDelay =
          Math.random() *
          4 + "s";


        final.appendChild(
          petal
        );

      }

    }
  );

</script>
